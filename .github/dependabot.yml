version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # init and analyze must move together; one PR per bump, never split.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
