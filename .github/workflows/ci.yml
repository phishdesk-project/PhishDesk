name: Foundation CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m mypy
      - run: python -m pytest -q
      - run: python scripts/export_contracts.py --check
      - run: python scripts/check_roadmap.py
      - run: python -m phishdesk.demo
      - run: python -m phishdesk.parsing.demo tests/fixtures/mime
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose config --quiet
      - run: docker compose up --build --detach
      - name: Check loopback mock health
        run: |
          python - <<'PY'
          import json, time, urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2) as response:
                      assert json.load(response)['mode'] == 'synthetic_mock'
                  break
              except (OSError, AssertionError):
                  if attempt == 29:
                      raise
                  time.sleep(1)
          PY
      - if: always()
        run: docker compose down --volumes
