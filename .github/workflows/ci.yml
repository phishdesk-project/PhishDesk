name: Foundation CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.11', '3.13']
    # Disposable database for tests/worker. Credentials are throwaway test values.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: phishdesk
          POSTGRES_PASSWORD: phishdesk-ci
          POSTGRES_DB: phishdesk_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U phishdesk -d phishdesk_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      PHISHDESK_TEST_DATABASE_URL: postgresql+psycopg://phishdesk:phishdesk-ci@127.0.0.1:5432/phishdesk_test
      PHISHDESK_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m mypy
      - run: python -m pytest -q
      - run: python scripts/export_contracts.py --check
      - run: python scripts/check_roadmap.py
      - run: python -m phishdesk.demo
      - run: python -m phishdesk.parsing.demo tests/fixtures/mime
      - run: python -m phishdesk.checks.demo
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose config --quiet
      - run: docker compose up --build --detach
      - name: Check loopback mock health
        run: |
          python - <<'PY'
          import json, time, urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2) as response:
                      assert json.load(response)['mode'] == 'synthetic_mock'
                  break
              except (OSError, AssertionError):
                  if attempt == 29:
                      raise
                  time.sleep(1)
          PY
      - if: always()
        run: docker compose down --volumes
